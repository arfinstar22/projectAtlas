<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1e3a5f"/>
  
  <!-- Grid lines representing document structure / knowledge graph -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <line x1="16" y1="20" x2="48" y2="20"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="16" y1="44" x2="48" y2="44"/>
  </g>
  
  <!-- Central node - the "intelligence" connecting documents -->
  <circle cx="32" cy="32" r="8" fill="#3b82f6" opacity="0.9"/>
  
  <!-- Connection lines from center to corners (knowledge graph) -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="32" x2="20" y2="20"/>
    <line x1="32" y1="32" x2="44" y2="20"/>
    <line x1="32" y1="32" x2="20" y2="44"/>
    <line x1="32" y1="32" x2="44" y2="44"/>
  </g>
  
  <!-- Document corner nodes -->
  <g fill="#3b82f6" opacity="0.7">
    <rect x="17" y="17" width="6" height="6" rx="1"/>
    <rect x="41" y="17" width="6" height="6" rx="1"/>
    <rect x="17" y="41" width="6" height="6" rx="1"/>
    <rect x="41" y="41" width="6" height="6" rx="1"/>
  </g>
  
  <!-- Central highlight -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" opacity="0.3"/>
</svg>