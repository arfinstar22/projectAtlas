name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first (workspace dependency order: core -> ai/document ->
      # server/web). Typecheck resolves @atlas/* through each package's
      # dist/*.d.ts, so it must run AFTER the packages are built — on a fresh
      # checkout there is no dist/ and typecheck-before-build fails (TS2307).
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  e2e:
    name: E2E smoke (mock AI provider)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No AI provider keys exist on CI runners: with no GOOGLE_API_KEY /
      # OPENROUTER_API_KEY the server falls back to the deterministic Mock
      # provider, which the smoke suite is written to accept (it treats
      # NO_API_KEY as a valid /ai/test outcome). E2E runs in a separate job
      # so a flaky port/startup failure cannot mask a typecheck failure.
      - name: Start server (mock provider, ephemeral DB)
        run: |
          npm run build --workspace=packages/core
          npm run build --workspace=packages/ai
          npm run build --workspace=packages/document
          npm run build --workspace=apps/server
          (cd apps/server && nohup node dist/index.js > /tmp/atlas-server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "server ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "server failed to start"; tail -50 /tmp/atlas-server.log; exit 1
            fi
            sleep 1
          done

      - name: Run E2E smoke
        run: node scripts/e2e-smoke.mjs

      - name: Dump server logs on failure
        if: failure()
        run: tail -100 /tmp/atlas-server.log
